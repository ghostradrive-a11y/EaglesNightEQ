name: Build Eagles Night EQ

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup JUCE
      run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git
    - name: Configure CMake
      run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64
    - name: Build Release
      run: cmake --build build --config Release
    - name: Upload VST3
      uses: actions/upload-artifact@v4
      with:
        name: EaglesNightEQ-Windows-VST3
        path: build/EaglesNightEQ_artefacts/Release/VST3/
    - name: Upload Standalone
      uses: actions/upload-artifact@v4
      with:
        name: EaglesNightEQ-Windows-Standalone
        path: build/EaglesNightEQ_artefacts/Release/Standalone/

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup JUCE
      run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git
    - name: Configure CMake
      run: cmake -B build -S . -G Xcode
    - name: Build Release
      run: cmake --build build --config Release
    - name: Upload VST3
      uses: actions/upload-artifact@v4
      with:
        name: EaglesNightEQ-macOS-VST3
        path: build/EaglesNightEQ_artefacts/Release/VST3/
    - name: Upload AU
      uses: actions/upload-artifact@v4
      with:
        name: EaglesNightEQ-macOS-AU
        path: build/EaglesNightEQ_artefacts/Release/AU/
    - name: Upload Standalone
      uses: actions/upload-artifact@v4
      with:
        name: EaglesNightEQ-macOS-Standalone
        path: build/EaglesNightEQ_artefacts/Release/Standalone/

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev
    - name: Setup JUCE
      run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git
    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
    - name: Build Release
      run: cmake --build build --config Release --parallel $(nproc)
    - name: Upload VST3
      uses: actions/upload-artifact@v4
      with:
        name: EaglesNightEQ-Linux-VST3
        path: build/EaglesNightEQ_artefacts/Release/VST3/
    - name: Upload Standalone
      uses: actions/upload-artifact@v4
      with:
        name: EaglesNightEQ-Linux-Standalone
        path: build/EaglesNightEQ_artefacts/Release/Standalone/
